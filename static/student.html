<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Pulse</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 8vh 1rem 2rem; }
  #lost { font-size: 2rem; padding: 2rem 3rem; border-radius: 1rem; border: none;
          background: #e74c3c; color: white; }
  .opt { display: block; width: 100%; max-width: 340px; margin: .4rem auto;
         padding: .9rem; font-size: 1.05rem; border-radius: 10px;
         border: 2px solid #2c3e50; background: white; }
  #why { display: none; margin-top: 1rem; }
  #prompt { display: none; border: 2px solid #2c3e50; border-radius: 12px;
            padding: .5rem 1rem 1rem; margin: 0 auto 1.5rem; max-width: 360px; }
  .yes { background: #abebc6; }
  .no { background: #f5b7b1; }
</style></head>
<body>
  <div id="prompt">
    <h3>Your teacher explained again.<br>Clearer now?</h3>
    <button class="opt yes" onclick="clearer('yes')">👍 Yes, clearer</button>
    <button class="opt no" onclick="clearer('no')">😕 Still lost</button>
  </div>

  <button id="lost" onclick="tap()">😕 I'm lost</button>
  <p id="msg"></p>

  <div id="why">
    <p>Why? (optional)</p>
    <button class="opt" onclick="reason('fast')">🏃 Too fast</button>
    <button class="opt" onclick="reason('concept')">🤔 Don't get the concept</button>
    <button class="opt" onclick="reason('example')">💡 Need an example</button>
    <button class="opt" onclick="reason('access')">🔇 Can't see or hear</button>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/student");
  let promptId = 0;

  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === "prompt") {
      promptId = d.id;
      $("prompt").style.display = d.show ? "block" : "none";
    }
  };

  function tap() {
    ws.send(JSON.stringify({type: "confused"}));
    $("msg").innerText = "Sent anonymously ✔";
    $("why").style.display = "block";
  }

  function reason(r) {
    ws.send(JSON.stringify({type: "reason", reason: r}));
    $("why").style.display = "none";
    $("msg").innerText = "Thanks, your teacher knows ✔";
  }

  function clearer(answer) {
    ws.send(JSON.stringify({type: "clearer", id: promptId, answer: answer}));
    $("prompt").style.display = "none";
  }
</script></body></html>
