<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  body { font-family: sans-serif; padding: 1.5rem; max-width: 900px; margin: auto; }
  .big { font-size: 4rem; font-weight: bold; }
  #alert { display: none; background: #e74c3c; color: white; padding: 1rem;
           border-radius: 8px; font-size: 1.2rem; margin-bottom: 1rem; }
  #rx { background: #f4f6f7; border-radius: 8px; padding: .7rem 1rem; margin: .7rem 0; }
  li { margin: 0.3rem 0; }
</style></head>
<body>
  <div id="alert"></div>
  <div style="float:right; text-align:center">
    <div id="qr"></div>
    <select id="ipsel" onchange="drawQR()"></select><br>
    <small>Scan to join. If it fails, pick another address.</small>
  </div>

  <h2>Topic: <span id="topic"></span></h2>
  <div class="big"><span id="percent">0</span>% confused</div>
  <p><span id="confused">0</span> of <span id="students">0</span> students</p>

  <input id="newtopic" placeholder="Next topic">
  <button onclick="setTopic()">Switch topic</button>
  <a href="/summary" target="_blank">Open summary</a>

  <div style="margin-top:1rem">
    <button onclick="reexplain()">🔁 I re-explained: ask the class</button>
    <div id="rx">No re-explain check yet.</div>
  </div>

  <h3>Confusion timeline</h3>
  <canvas id="chart" height="120"></canvas>

  <h3>Why they're lost (last minute)</h3>
  <ul id="reasons"><li>No reasons yet</li></ul>

  <h3>Spike moments</h3>
  <ul id="spikelist"><li>None yet</li></ul>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const clock = (t) => new Date(t * 1000).toLocaleTimeString();

  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws/teacher");

  function drawQR() {
    $("qr").innerHTML = "";
    new QRCode($("qr"), {text: $("ipsel").value, width: 140, height: 140});
  }
  fetch("/api/info").then(r => r.json()).then(i => {
    $("ipsel").innerHTML = i.urls.map(u => `<option>${u}</option>`).join("");
    drawQR();
  });

  const chart = new Chart($("chart"), {
    type: "line",
    data: { labels: [], datasets: [{
      label: "Confusion %", data: [], borderColor: "#e74c3c",
      tension: 0.3, pointRadius: 2,
      pointBackgroundColor: [], pointBorderColor: []
    }]},
    options: { animation: false, scales: { y: { min: 0, max: 100 } } }
  });

  function renderRx(r) {
    if (!r) { $("rx").innerHTML = "No re-explain check yet."; return; }
    let html;
    if (r.open) {
      const waiting = r.targets - r.yes - r.no;
      html = `<b>Asking ${r.targets} students who were lost…</b>
              ${r.yes} clearer, ${r.no} still lost, ${waiting} waiting (${r.left}s left)`;
    } else {
      const pct = r.targets ? Math.round(100 * r.yes / r.targets) : 0;
      html = `<b>Last re-explain (${esc(r.topic)}):</b>
              ${r.yes} of ${r.targets} lost students say it's clearer (${pct}%)`;
      if (r.recovery !== null) html += `, half were clear within ${r.recovery}s`;
      html += `. Class confusion ${r.before}% → ${r.after}%.`;
    }
    $("rx").innerHTML = html;
  }

  ws.onmessage = (e) => {
    const d = JSON.parse(e.data);
    if (d.type === "notice") { alert(d.text); return; }
    if (d.type !== "state") return;

    $("percent").innerText = d.percent;
    $("confused").innerText = d.confused;
    $("students").innerText = d.students;
    $("topic").innerText = d.topic;

    // timeline, with spike points drawn big and dark red
    const spikeTimes = new Set(d.spikes.map(s => s.t));
    chart.data.labels = d.history.map(h => clock(h.t));
    chart.data.datasets[0].data = d.history.map(h => h.percent);
    chart.data.datasets[0].pointBackgroundColor =
      d.history.map(h => spikeTimes.has(h.t) ? "#7b0000" : "#e74c3c");
    chart.data.datasets[0].pointRadius =
      d.history.map(h => spikeTimes.has(h.t) ? 8 : 2);
    chart.update("none");

    // why they are lost
    $("reasons").innerHTML = d.reasons.length
      ? d.reasons.map(x => `<li>${x.label}: <b>${x.count}</b></li>`).join("")
        + (d.suggestion ? `<li><b>Suggestion:</b> ${d.suggestion}</li>` : "")
      : "<li>No reasons yet</li>";

    renderRx(d.reexplain);

    // spike list
    $("spikelist").innerHTML = d.spikes.length
      ? d.spikes.slice().reverse().map(s =>
          `<li>${clock(s.t)}: ${s.percent}% confused during "${esc(s.topic)}"</li>`).join("")
      : "<li>None yet</li>";

    // banner if a spike happened in the last 20 seconds
    const box = $("alert");
    const last = d.spikes[d.spikes.length - 1];
    if (last && Date.now() / 1000 - last.t < 20) {
      box.style.display = "block";
      box.innerText = "Confusion spike: " + last.percent + "% of the class just got lost on \"" + last.topic + "\"."
        + (d.suggestion ? " Suggestion: " + d.suggestion + "." : "");
    } else {
      box.style.display = "none";
    }
  };

  function setTopic() {
    ws.send(JSON.stringify({type: "set_topic", topic: $("newtopic").value}));
  }
  function reexplain() {
    ws.send(JSON.stringify({type: "reexplain"}));
  }
</script></body></html>
